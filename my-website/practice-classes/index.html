<!DOCTYPE html>
<html lang="en">
<head>
    <title>Practice With Classes</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    body {
        height: 3000px;
        padding-top: 50px;
        
    }



.banana-image {
    height: 300px;
    
}


.answer-bar-container {
    color: rgb(12, 10, 10);
    font-size: 20px;
    width: 370px;
    height: 30px;
    background-color: rgb(61, 61, 61);
    border-radius: 8px;
    margin-top: 50px;
    border-bottom-right-radius: 0px;
    border-bottom-left-radius: 0px;
    padding: 10px;
    padding-top: 15px;
}


.answer-bar {
    background-color: white;
    border-radius: 4px;
    height: 25px;
    
}


.calculator-container {
    display: grid;
    bottom: 210px;
    grid-template-columns: repeat(4, 1fr);
    background-color: rgb(19, 16, 15);
    height: 325px;
    width: 350px;
    border-radius: 8px;
    border-top-left-radius: 0px;
    border-top-right-radius: 0px;
    padding: 20px;
}


.main-button {
    height: 50px;
    width: 50px;
    border-radius: 8px;
}


.number-buttons {
    font-size: 18px;
    color: white;
    display: flex;
    justify-content: center;
    border: solid 1px rgb(49, 49, 49);
    height: 75px;
    width: 75px;
    border-radius: 10px;
    background-color: rgb(102, 101, 101);
}


.symbols {
    font-size: 20px;
    font-weight: 500;
    background-color: rgb(240, 165, 26);
}



.fruits-container {
    margin-top: 300px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    height: auto;
    justify-content: center;
    column-gap: 30px;
}


.my-fruits {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.produce {
border: 2px black;
height: 300px;
}


</style>

</head>
<body>


<input type="text" placeholder="Search">

<button onclick="addOne();">Add</button>

<div class="answer-bar-container">
    <div class="answer-bar js-cal"></div>
</div>
<div class="calculator-container">

  <button class="main-button js-clear">CE</button>
    <button class="number-buttons js-button">1</button>
    <button class="number-buttons js-button">2</button>
    <button class="number-buttons js-button">3</button>

    <button class="number-buttons js-button">4</button>
    <button class="number-buttons js-button">5</button>
    <button class="number-buttons js-button">6</button>
    <button class="number-buttons js-button">7</button>
    
    <button class="number-buttons js-button">8</button>
    <button class="number-buttons js-button">9</button>
    <button class="number-buttons js-button">0</button>

<div>
    <button class="symbols js-button">+</button>
    <button class="symbols js-button">-</button>
    <button class="symbols js-equals">=</button>
</div>
</div>


<div class="fruit-container js-fruit-container">
</div>

<div class="fruits-container js-fruits-container">


</div>








<script type="module" src="practice-classes.js">
</script>

<script>

    localStorage.getItem('plusOne');
    
let plusOne = 0;
    function addOne() {
        plusOne += 1;
        localStorage.setItem('plusOne', plusOne);
        console.log(plusOne);  
    }
</script>

</body>
</html>
