        <script>


//getting requests from backend

//using XML
const xhr = new XMLHttpRequest();
xhr.addEventListener('load', () => {

    console.log(xhr.response);
});
xhr.open('GET', 'https://supersimplebackend.dev');
xhr.send();



//using the fetch method
fetch('https://supersimplebackend.dev').then((response) => {
    return response.text();
}).then((text) => {
console.log(text);
});



//using the fetch method along with async await
 async function fetchData() {
    const response = await fetch('https://supersimplebackend.dev');
    const text = await response.text();
    console.log(text);
 } 
 fetchData();


//using fetch and async await to create POST request to greeting
async function postGreeting() {
    const response = await fetch('https://supersimplebackend.dev/greeting', {
method: 'POST',
headers: {
'Content-Type': 'application/json'
},

body: JSON.stringify({
    name: 'David'
})
    });   
    const text = await response.text();
    console.log(text);
}
postGreeting();



//made a GET request to amazon that returned an error CORS with an 'error handling'
async function getAmazon() {
try {
    const response = await fetch('https://amazon.com');
    const text = await response.text();
    console.log(text);
} catch (error) {
console.log('CORS error. Your request was blocked by the backend.')
}
}
getAmazon();




//
async function superRequest() {
    try {
const response = await fetch('https://supersimplebackend.dev/greeting', {
    method: 'POST',
    headers: {
        'Content-Type': 'application/json'
    }
});

if (response.status >= 400) {
    throw response;
}
const text = await response.text();
console.log(text);
}

catch (error) {

    if (error.status === 400) {
const errorMessage = await error.json();
console.log(errorMessage);
}

else {
    console.log('Network error. Please try again later.');
}
}
}
superRequest();






        </script>
    </body>
</html>
